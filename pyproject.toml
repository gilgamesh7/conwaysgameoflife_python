[project]
name = "game-of-life"
version = "0.1.0"
description = "Conway's Game of Life built in Python 3.14 with modular architecture"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "result>=0.17.0",
]

[project.scripts]
game-of-life = "game_of_life.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
